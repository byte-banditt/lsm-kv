name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: Run benchmark and upload five-run median JSON as baseline candidate
        type: boolean
        required: false
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitizer: ""
          - name: ASan+UBSan
            build_type: Debug
            sanitizer: -fsanitize=address,undefined -fno-omit-frame-pointer
    name: build-test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS="${{ matrix.sanitizer }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure benchmark
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build benchmark
        run: cmake --build build-bench --target lsm_bench --parallel
      - name: Run benchmark and prepare baseline candidate
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        run: |
          mkdir -p bench-runs
          ./build-bench/lsm_bench bench-runs/work 5 > bench-runs/result.json
          cat bench-runs/result.json
      - name: Run benchmark and gate
        if: github.event_name != 'workflow_dispatch' || !inputs.update_baseline
        run: |
          mkdir -p bench-runs
          ./build-bench/lsm_bench bench-runs/work 5 > bench-runs/result.json
          if [ -f bench/baseline.json ]; then
            ./build-bench/lsm_bench --compare bench-runs/result.json bench/baseline.json
          else
            echo 'Benchmark gate skipped: bench/baseline.json does not exist.'
          fi
          cat bench-runs/result.json
      - name: Upload baseline candidate
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline-candidate
          path: bench-runs/result.json
