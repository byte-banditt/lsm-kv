name: Nightly crash recovery

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  crash-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run 200-iteration crash-recovery test
        run: ctest --test-dir build --output-on-failure -R '^DB\.CrashAckedWrites200Iterations$'
